<!-- Esta pantalla permite elegir un nivel. -->
<!-- Selector de los cinco niveles disponibles. -->
<div id="pantalla-niveles" class="pantalla">
    <div class="pantalla-contenido">
        <h2 class="titulo-pantalla">SELECCIONA UN NIVEL</h2>
        <div class="niveles-grid">
            <button type="button" class="btn-nivel" data-nivel="1" onclick="seleccionarNivel(1)"><img class="nivel-imagen" src="../Recursos Graficos/botones/boton de nivel 1.png" alt="Nivel 1: La Ciudad"></button>
            <button type="button" class="btn-nivel" data-nivel="2" onclick="seleccionarNivel(2)"><img class="nivel-imagen" src="../Recursos Graficos/botones/boton de nivel 2.png" alt="Nivel 2: El Camino"></button>
            <button type="button" class="btn-nivel" data-nivel="3" onclick="seleccionarNivel(3)"><img class="nivel-imagen" src="../Recursos Graficos/botones/boton del nivel 3.png" alt="Nivel 3: La Manga"></button>
            <button type="button" class="btn-nivel" data-nivel="4" onclick="seleccionarNivel(4)"><img class="nivel-imagen" src="../Recursos Graficos/botones/boton de nivel 4.png" alt="Nivel 4: El Mondonguero"></button>
            <button type="button" class="btn-nivel" data-nivel="5" onclick="seleccionarNivel(5)"><img class="nivel-imagen" src="../Recursos Graficos/botones/boton de nivel 5.png" alt="Nivel 5: El Desenlace"></button>
        </div>
        <button type="button" class="btn-volver" onclick="volverDesdeNiveles()"><img src="../Recursos Graficos/botones/boton de volver.png" alt="Volver"></button>
    </div>
</div>
