<!-- Esta pantalla permite elegir un nivel. -->
<!-- Selector del tutorial y los cinco niveles disponibles. -->
<div id="pantalla-niveles" class="pantalla">
    <div class="pantalla-contenido">
        <h2 class="titulo-pantalla">SELECCIONA UN NIVEL</h2>
        <button type="button" class="btn-nivel btn-nivel-tutorial" data-nivel="0" onclick="seleccionarNivel(0)">
            <span class="tutorial-nombre">TUTORIAL</span>
            <span class="tutorial-descripcion">Practica cómo moverte, saltar y llegar a la meta.</span>
        </button>
        <div class="niveles-grid">
            <button type="button" class="btn-nivel" data-nivel="1" onclick="seleccionarNivel(1)"><img class="nivel-imagen" src="../Recursos Graficos/botones/boton de nivel 1.png" alt="Nivel 1: La Ciudad"></button>
            <button type="button" class="btn-nivel" data-nivel="2" onclick="seleccionarNivel(2)"><img class="nivel-imagen" src="../Recursos Graficos/botones/boton de nivel 2.png" alt="Nivel 2: El Camino"><span class="candado-nivel" aria-hidden="true">&#128274;</span></button>
            <button type="button" class="btn-nivel" data-nivel="3" onclick="seleccionarNivel(3)"><img class="nivel-imagen" src="../Recursos Graficos/botones/boton del nivel 3.png" alt="Nivel 3: La Manga"><span class="candado-nivel" aria-hidden="true">&#128274;</span></button>
            <button type="button" class="btn-nivel" data-nivel="4" onclick="seleccionarNivel(4)"><img class="nivel-imagen" src="../Recursos Graficos/botones/boton de nivel 4.png" alt="Nivel 4: El Mondonguero"><span class="candado-nivel" aria-hidden="true">&#128274;</span></button>
            <button type="button" class="btn-nivel" data-nivel="5" onclick="seleccionarNivel(5)"><img class="nivel-imagen" src="../Recursos Graficos/botones/boton de nivel 5.png" alt="Nivel 5: El Desenlace"><span class="candado-nivel" aria-hidden="true">&#128274;</span></button>
        </div>
        <button type="button" class="btn-volver" onclick="volverDesdeNiveles()"><img src="../Recursos Graficos/botones/boton de volver.png" alt="Volver"></button>
    </div>
</div>
