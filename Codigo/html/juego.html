<!-- Esta pantalla contiene la partida principal. -->
<!-- Partida principal: HUD, canvas y controles para dispositivos táctiles. -->
<div id="pantalla-juego" class="pantalla">
    <div class="juego-contenedor">
        <div class="hud"><div class="hud-izquierda"><div class="hud-vida"><span class="corazones-vida" id="hud-corazones"><span class="corazon" aria-label="Vida 1">&#9829;</span><span class="corazon" aria-label="Vida 2">&#9829;</span><span class="corazon" aria-label="Vida 3">&#9829;</span></span></div><div class="hud-puntaje"><span class="hud-icono-generado icono-puntaje" aria-label="Puntaje">&#9733;</span><span id="hud-puntaje-texto">0</span></div></div><div class="hud-derecha"><div class="hud-tiempo"><span class="hud-icono-generado icono-tiempo" aria-label="Tiempo">&#9201;</span><span id="hud-tiempo-texto">03:00</span></div><button class="btn-pausa" onclick="pausarJuego()">||</button></div></div>
        <div class="hud-centro"><div class="hud-progreso"><div class="hud-progreso-track" role="progressbar" aria-label="Progreso del nivel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="hud-progreso-fill" class="hud-progreso-fill"></div></div><span id="hud-progreso-texto" class="hud-progreso-texto">0%</span></div></div>
        <canvas id="canvas-juego"></canvas>
        <div id="tutorial-ayuda" class="tutorial-ayuda oculto" role="status">Muévete con A/D o las flechas. Salta con W, ↑ o espacio para cruzar el pozo. Recoge la llave y pulsa Z junto a la puerta para abrirla; luego llega a la meta.</div>
        <div class="controles-moviles"><div class="controles-moviles-izquierda"><button type="button" class="btn-control" id="btn-izquierda" data-direccion="izquierda" aria-label="Mover a la izquierda"></button><button type="button" class="btn-control" id="btn-derecha" data-direccion="derecha" aria-label="Mover a la derecha"></button></div><div class="controles-moviles-derecha"><button type="button" class="btn-control btn-saltar" id="btn-saltar" aria-label="Saltar"></button></div></div>
    </div>
</div>
