<!-- Esta pantalla muestra el menu principal. -->
<!-- Menú principal y accesos a niveles, opciones y créditos. -->
<div id="pantalla-menu" class="pantalla activa">
    <button type="button" class="btn-salir btn-salir-menu" onclick="cerrarSesion()"><img src="../Recursos Graficos/botones/boton de cerrar sesion.png" alt="Cerrar sesión"></button>
    <div class="pantalla-contenido">
        <img src="../Recursos Graficos/interfaz/logo la aventura de facundo.png" alt="Logo" class="logo-principal">
        <div class="menu-botones">
            <button type="button" class="btn-menu" onclick="mostrarPantalla('pantalla-niveles')"><img src="../Recursos Graficos/botones/boton jugar.png" alt="Jugar"></button>
            <button type="button" class="btn-menu" onclick="mostrarProgreso()"><img src="../Recursos Graficos/botones/boton de progreso.png" alt="Progreso"></button>
            <button type="button" class="btn-menu" onclick="abrirOpciones('pantalla-menu')"><img src="../Recursos Graficos/botones/boton opciones.png" alt="Opciones"></button>
            <button type="button" class="btn-menu" onclick="mostrarPantalla('pantalla-creditos')"><img src="../Recursos Graficos/botones/boton creditos.png" alt="Creditos"></button>
        </div>
    </div>
</div>
